name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          test -f dev.html || (echo "dev.html not found" && exit 1)
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' --exclude='debug.keystore' --exclude='debug.keystore.b64' --exclude='android-extra' ./ www/
          cp dev.html www/index.html
          sed -i "s/script-src 'self'/script-src 'self' 'unsafe-inline'/" www/index.html
          sed -i 's#</body>#<script src="js/mods.js"></script><script src="js/lan.js"></script></body>#' www/index.html
          grep -q 'js/mods.js' www/index.html || (echo "could not add mods.js" && exit 1)
          grep -q 'js/lan.js' www/index.html || (echo "could not add lan.js" && exit 1)
      - name: Fixed signing key
        run: |
          test -f debug.keystore.b64 || (echo "debug.keystore.b64 is missing from the repo root" && exit 1)
          tr -d ' \r\n' < debug.keystore.b64 | base64 -d > debug.keystore
          keytool -list -keystore debug.keystore -storepass android | grep -q androiddebugkey || (echo "keystore text is damaged" && exit 1)
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Set up Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init PokeSurvivor com.example.pokesurvivor --web-dir=www
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.server={hostname:'pokesurvivor.local',androidScheme:'https'};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: Add LAN plugin
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          test -n "$MAIN" || (echo "MainActivity.java not found" && exit 1)
          D=$(dirname "$MAIN")
          cp android-extra/PsLanPlugin.java "$D/PsLanPlugin.java"
          cp android-extra/MainActivity.java "$D/MainActivity.java"
      - name: Use the fixed key in Gradle
        run: |
          test -f android/app/build.gradle || (echo "android/app/build.gradle not found" && exit 1)
          {
            echo ""
            echo "android {"
            echo "    signingConfigs {"
            echo "        debug {"
            echo "            storeFile file('$GITHUB_WORKSPACE/debug.keystore')"
            echo "            storePassword 'android'"
            echo "            keyAlias 'androiddebugkey'"
            echo "            keyPassword 'android'"
            echo "        }"
            echo "    }"
            echo "}"
          } >> android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
