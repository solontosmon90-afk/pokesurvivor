name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          test -f index.html || (echo "index.html not at repo root" && exit 1)
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' ./ www/
      - name: Set up Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init PokeSurvivor com.example.pokesurvivor --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
